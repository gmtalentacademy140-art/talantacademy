<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talent Academy</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(to bottom,#dff6ff,#f7fff1,#fff6d9);}
.hero{padding:100px 20px;text-align:center;}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;padding:40px;}
.card{padding:30px;border-radius:30px;color:white;box-shadow:0 10px 25px rgba(0,0,0,0.1);}
</style>
</head>
<body>

<header class="bg-white shadow-md p-4 flex justify-between items-center">
<h1 class="text-4xl font-black">
<span style="color:#ff7a00;">Talent</span>
<span style="color:#0038a8;">Academy</span>
</h1>
</header>

<section class="hero">
<h2 class="text-6xl font-black mb-6">
Welcome to
<span style="color:#ff7a00;">Talent</span>
<span style="color:#0038a8;">Academy</span>
</h2>

<p class="text-2xl text-gray-700 max-w-3xl mx-auto leading-10">
حضانة تعليمية حديثة لتنمية مهارات الأطفال بالتعلم واللعب والإبداع
</p>
</section>

<section class="cards">
<div class="card" style="background:#7b2cbf;">
<h3>⭐ تعلم ممتع</h3>
<p>أنشطة تعليمية ممتعة للأطفال بطريقة حديثة.</p>
</div>

<div class="card" style="background:#ff8500;">
<h3>🎨 أنشطة إبداعية</h3>
<p>رسم وموسيقى وألعاب لتنمية الإبداع.</p>
</div>

<div class="card" style="background:#38b000;">
<h3>🌱 تنمية مبكرة</h3>
<p>تطوير الثقة والمهارات الاجتماعية للأطفال.</p>
</div>
</section>

<footer class="bg-black text-white text-center py-8 text-xl">
© 2026 Talent Academy
</footer>

</body>
</html>
